name: Vitest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test

      - name: Run linter
        run: bun run lint

      # 全 Story を描画し、play 関数と a11y チェック（axe、WCAG 2.2 AA）を当てる（@storybook/addon-vitest）
      - name: Install Chromium for Story tests
        run: bunx playwright install --with-deps chromium

      - name: Run Story tests
        run: bun run test:stories

      # MDX のドキュメントも含めてビルドする (--test は MDX を対象にしないので付けない)
      - name: Build Storybook
        run: bun run build-storybook --quiet
